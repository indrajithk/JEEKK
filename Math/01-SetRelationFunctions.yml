  - id: Kumite-06
    name: The Bijective Quadratic
    problem: "Let f: [a, ∞) → [b, ∞) be defined by f(x) = x^2 - 6x + 5. If f is bijective, find the *smallest* possible value of a+b."
    surprise_element: "It's not just finding *one* valid A, B pair, but optimizing for a condition (a+b) based on the vertex."
    dependent_katas:
      - K-029
      - K-040
      - K-041
      - K-042
