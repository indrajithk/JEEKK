  - id: Kumite-07
    name: The Graphical Parameter Problem
    problem: "Find the set of all real values of k for which the equation ||x^2 - 4| - 2| = k has exactly 6 distinct real solutions."
    surprise_element: "Requires two nested graph transformations (|f(x)| and |g(x)-2|) and then applying the Horizontal Line Test (K-060) multiple times."
    dependent_katas:
      - K-032
      - K-039
      - K-059
      - K-060
    expected_outcome: "Complete mastery of graphical transformations and parameter analysis."
