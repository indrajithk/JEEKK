  - id: Kumite-02
    name: The Equivalence Partition
    problem: "Let A = {x ∈ Z : 1 ≤ x ≤ 50}. A relation R is defined on A by aRb if f(a) = f(b), where f(x) = x (mod 7) (the remainder when x is divided by 7). 1. Prove R is an equivalence relation. 2. Find the number of elements in the equivalence class [3]."
    surprise_element: "The relation is *defined* by a function. The equivalence classes are the pre-images of the elements in the range."
    dependent_katas:
      - K-015
      - K-016
      - K-017
      - K-018
      - K-019
